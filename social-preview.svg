<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">depth-sol social preview</title>
  <desc id="desc">An experimental flat-web depth semantic using depth and a document light source called sol.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1727"/>
      <stop offset="65%" stop-color="#111126"/>
      <stop offset="100%" stop-color="#090b15"/>
    </linearGradient>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#83def1"/>
      <stop offset="100%" stop-color="#1787b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#54dcff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#54dcff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-30" dy="26" stdDeviation="20" flood-color="#020812" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="110" r="140" fill="#3fe5ff" fill-opacity="0.18"/>
  <circle cx="960" cy="110" r="74" fill="#bff9ff"/>
  <circle cx="960" cy="110" r="210" fill="url(#glow)" filter="url(#blur)"/>

  <g transform="translate(88 92)">
    <text x="0" y="0" fill="#8fdff3" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" letter-spacing="5">SPEC-STYLE CONCEPT PROJECT</text>
    <text x="0" y="96" fill="#f4f8fb" font-family="Iowan Old Style, Palatino Linotype, serif" font-size="76" font-weight="700">
      <tspan x="0" dy="0">depth-sol</tspan>
      <tspan x="0" dy="92">A flat-web spatial</tspan>
      <tspan x="0" dy="92">semantic experiment</tspan>
    </text>
    <text x="0" y="388" fill="#b4c0cf" font-family="Avenir Next, Segoe UI, sans-serif" font-size="30">
      <tspan x="0" dy="0">Use </tspan>
      <tspan fill="#f4f8fb" font-family="SFMono-Regular, Menlo, monospace">depth</tspan>
      <tspan> and </tspan>
      <tspan fill="#f4f8fb" font-family="SFMono-Regular, Menlo, monospace">&lt;sol&gt;</tspan>
      <tspan> for browser-safe spatial cues today,</tspan>
      <tspan x="0" dy="42">with a bridge to A-Frame and XR runtimes.</tspan>
    </text>
  </g>

  <g transform="translate(774 260)" filter="url(#shadow)">
    <ellipse cx="56" cy="164" rx="154" ry="48" fill="#46e0ff" fill-opacity="0.22" filter="url(#blur)"/>
    <rect x="0" y="0" width="212" height="152" rx="28" fill="url(#surface)"/>
    <rect x="0" y="0" width="212" height="24" rx="28" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="0" y="0" width="212" height="152" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="28" y="58" fill="#effcff" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" letter-spacing="3">DOM CARD</text>
    <text x="28" y="92" fill="#ffffff" font-family="Avenir Next, Segoe UI, sans-serif" font-size="26" font-weight="600">Depth-aware surface</text>
    <text x="28" y="122" fill="#d4eef7" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16">Flat in-browser, spatial in XR</text>
  </g>
</svg>
